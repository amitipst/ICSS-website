<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICSS Membership Registration</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for a polished look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc; /* Light background */
        }
        .form-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 5px 10px -5px rgba(0, 0, 0, 0.04);
            border-top: 5px solid #10b981; /* Emerald green accent */
        }
        .required-asterisk {
            color: #ef4444; /* Red color for mandatory fields */
            margin-left: 0.25rem;
        }
    </style>
</head>
<body class="p-4">

    <div class="form-container">
        <header class="text-center mb-8">
            <!-- ICSS Logo from assets/logo.jpg -->
            <img class="h-16 w-16 mx-auto mb-4 rounded-full shadow-lg" 
                 src="assets/logo.jpg" 
                 alt="ICSS Logo" 
                 onerror="this.onerror=null;this.src='https://placehold.co/64x64/10b981/ffffff?text=ICSS'">
            
            <h1 class="text-3xl font-bold text-gray-800">ICSS Membership Registration</h1>
            <p class="text-lg text-gray-500 mt-2">Take your first step to join the community.</p>
        </header>

        <!-- Formspree Action URL: https://formspree.io/f/xblqjvgp -->
        <form id="membershipForm" action="https://formspree.io/f/xblqjvgp" method="POST" class="space-y-6">

            <!-- Name -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">
                    Name <span class="required-asterisk">*</span>
                </label>
                <input type="text" name="Name" id="name" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
                       placeholder="Enter your full name">
            </div>

            <!-- Email ID (Mandatory) -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">
                    Email ID <span class="required-asterisk">*</span>
                </label>
                <input type="email" name="Email_ID" id="email" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
                       placeholder="you@example.com">
            </div>

            <!-- Mobile No. (Mandatory) -->
            <div>
                <label for="mobile" class="block text-sm font-medium text-gray-700">
                    Mobile No. <span class="required-asterisk">*</span>
                </label>
                <input type="tel" name="Mobile_No" id="mobile" required
                       pattern="[0-9]{10,15}"
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
                       placeholder="e.g., 9876543210">
                <p class="mt-1 text-xs text-gray-500">Please enter a valid phone number (min 10 digits).</p>
            </div>

            <!-- F.ET/I.P.S.T Roll No - -->
            <div>
                <label for="rollno" class="block text-sm font-medium text-gray-700">
                    F.ET/I.P.S.T Roll No - <span class="required-asterisk">*</span>
                </label>
                <input type="text" name="Roll_No" id="rollno" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
                       placeholder="e.g., 12345678">
            </div>

            <!-- Batch -->
            <div>
                <label for="batch" class="block text-sm font-medium text-gray-700">
                    Batch <span class="required-asterisk">*</span>
                </label>
                <input type="text" name="Batch" id="batch" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
                       placeholder="e.g., 2018-2022">
            </div>

            <!-- Current Location -->
            <div>
                <label for="location" class="block text-sm font-medium text-gray-700">
                    Current Location <span class="required-asterisk">*</span>
                </label>
                <input type="text" name="Current_Location" id="location" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
                       placeholder="City, State, Country">
            </div>

            <!-- Working Status (Yes/No) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Working <span class="required-asterisk">*</span>
                </label>
                <div class="flex items-center space-x-6">
                    <label class="inline-flex items-center">
                        <input type="radio" name="Working_Status" value="Yes" required class="form-radio h-4 w-4 text-emerald-600 border-gray-300" onclick="toggleOrganizationField(true)">
                        <span class="ml-2 text-gray-700">Yes</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="Working_Status" value="No" required class="form-radio h-4 w-4 text-emerald-600 border-gray-300" onclick="toggleOrganizationField(false)">
                        <span class="ml-2 text-gray-700">No</span>
                    </label>
                </div>
            </div>

            <!-- Current Organization (Conditional) -->
            <div id="organizationField" class="hidden">
                <label for="organization" class="block text-sm font-medium text-gray-700">
                    Current Organization <span class="required-asterisk">*</span>
                </label>
                <input type="text" name="Current_Organization" id="organization"
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
                       placeholder="Name of your current company/institution">
            </div>

            <!-- Submission Status Message Box -->
            <div id="statusMessage" class="hidden p-4 rounded-md text-sm" role="alert"></div>

            <!-- Action Buttons: Submit and Back to Home -->
            <div class="flex flex-col sm:flex-row-reverse sm:justify-between space-y-4 sm:space-y-0 sm:space-x-4">
                
                <!-- Submit Button -->
                <button type="submit" id="submitButton"
                        class="w-full sm:w-1/2 flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-medium text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition duration-150 ease-in-out">
                    Submit Membership
                </button>

                <!-- Back to Home Button -->
                <a href="index.html"
                   class="w-full sm:w-1/2 flex justify-center py-3 px-4 border border-gray-300 rounded-md shadow-sm text-lg font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                    Back to Home
                </a>
            </div>
        </form>
    </div>

    <script>
        /**
         * Toggles the visibility of the Current Organization field based on the 'Working' status.
         * @param {boolean} isWorking - True if 'Yes' is selected, false otherwise.
         */
        function toggleOrganizationField(isWorking) {
            const orgField = document.getElementById('organizationField');
            const orgInput = document.getElementById('organization');
            if (isWorking) {
                orgField.classList.remove('hidden');
                orgInput.setAttribute('required', 'required');
            } else {
                orgField.classList.add('hidden');
                orgInput.removeAttribute('required');
                orgInput.value = ''; // Clear value when hidden
            }
        }

        // Initialize the organization field state on page load
        document.addEventListener('DOMContentLoaded', () => {
            const workingRadios = document.getElementsByName('Working_Status');
            let isWorkingSelected = false;
            for (const radio of workingRadios) {
                if (radio.checked && radio.value === 'Yes') {
                    isWorkingSelected = true;
                    break;
                }
            }
            toggleOrganizationField(isWorkingSelected);
        });

        // Handle form submission using Formspree's AJAX method
        const form = document.getElementById('membershipForm');
        const statusMessage = document.getElementById('statusMessage');
        const submitButton = document.getElementById('submitButton');

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            const data = new FormData(form);
            const action = event.target.action;

            // Simple client-side validation check for the Organization field if "Yes" is selected
            const workingStatus = document.querySelector('input[name="Working_Status"]:checked')?.value;
            const organization = document.getElementById('organization').value.trim();

            if (workingStatus === 'Yes' && !organization) {
                displayMessage('Please enter your Current Organization.', 'error');
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';

            try {
                const response = await fetch(action, {
                    method: 'POST',
                    body: data,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    form.reset();
                    toggleOrganizationField(false); // Hide and clear organization field
                    displayMessage('Thank you! Your membership application has been successfully submitted to the ICSS team.', 'success');
                } else {
                    const errorData = await response.json();
                    if (errorData.errors) {
                        displayMessage('Submission failed: ' + errorData.errors.map(e => e.field + ' ' + e.message).join(', '), 'error');
                    } else {
                        displayMessage('Submission failed. Please try again or check your form settings.', 'error');
                    }
                }
            } catch (error) {
                console.error('Submission error:', error);
                displayMessage('An unexpected error occurred. Please try again later.', 'error');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Submit Membership';
            }
        });

        /**
         * Displays a submission status message.
         * @param {string} message - The message to display.
         * @param {'success'|'error'} type - The type of message.
         */
        function displayMessage(message, type) {
            statusMessage.textContent = message;
            statusMessage.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800');

            if (type === 'success') {
                statusMessage.classList.add('bg-green-100', 'text-green-800');
            } else if (type === 'error') {
                statusMessage.classList.add('bg-red-100', 'text-red-800');
            }

            // Show the message
            statusMessage.classList.remove('hidden');

            // Hide the message after 7 seconds
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 7000);
        }
    </script>

</body>
</html>
